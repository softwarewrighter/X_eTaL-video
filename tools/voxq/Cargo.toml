[package]
name = "voxq"
version = "0.1.0"
edition = "2021"
description = "The one client of the VoxCPM voice server: queues requests from a directory, sends them one at a time, writes results where each requester asked."

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs4 = { version = "0.13", features = ["sync"] }
